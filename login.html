<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Tratra</title>
    <meta name="description" content="Sign in to your Tratra educator account and continue your professional development.">
    <link rel="canonical" href="https://tratraedu.com/login.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="system.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between h-16 items-center"><a href="index.html" class="flex items-center gap-3"><img src="logo.jpg" alt="TratraEdu logo" class="h-12 w-auto object-contain"><span class="text-2xl font-bold text-slate-800 hidden sm:block">TratraEdu</span></a><a href="register.html" class="text-slate-600 hover:text-indigo-600">Create Account</a></div></div></nav>
    <main class="flex-grow flex items-center justify-center py-12 px-4"><div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100"><div class="text-center mb-8"><h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome Back</h1><p class="text-slate-500">Sign in to continue your learning journey.</p></div><form id="loginForm" class="space-y-5"><div><label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label><input type="email" id="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="john@school.edu"></div><div><label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Your password"></div><p id="loginStatus" class="hidden text-sm rounded-lg p-3"></p><button id="loginButton" type="submit" class="w-full py-3 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg">Sign In</button></form><p class="mt-6 text-center text-sm text-slate-500">Don't have an account? <a href="register.html" class="text-indigo-600 font-semibold hover:underline">Sign up</a></p></div></main>
    <footer class="bg-slate-900 text-slate-400 py-8 mt-auto"><div class="max-w-7xl mx-auto px-4 text-center text-sm"><a href="privacy.html" class="mx-3 hover:text-white">Privacy Policy</a><a href="terms.html" class="mx-3 hover:text-white">Terms</a><a href="contact.html" class="mx-3 hover:text-white">Contact</a><p class="mt-5">&copy; 2026 Tratra Teacher Training. All rights reserved.</p></div></footer>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("loginButton");
        const status = document.getElementById("loginStatus");
        button.disabled = true;
        button.textContent = "Signing in...";
        status.className = "hidden";
        try {
          const user = await Tratra.auth.login(document.getElementById("email").value, document.getElementById("password").value);
          window.location.href = user.email.toLowerCase() === Tratra.ADMIN_EMAIL ? "admin.html" : "dashboard.html";
        } catch (error) {
          status.textContent = error.message || "Could not sign in.";
          status.className = "text-sm rounded-lg p-3 bg-red-50 text-red-700";
          button.disabled = false;
          button.textContent = "Sign In";
        }
      });
    </script>
</body>
</html>
