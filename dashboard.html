<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Tratra</title>
    <meta name="description" content="Access your Tratra educator courses, progress, and certification learning.">
    <link rel="canonical" href="https://tratraedu.com/dashboard.html">
    <meta property="og:title" content="Teacher Dashboard | Tratra">
    <meta property="og:description" content="Access your Tratra educator courses, progress, and certification learning.">
    <meta property="og:url" content="https://tratraedu.com/dashboard.html">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="system.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-indigo-900 text-white hidden md:flex flex-col">
        <div class="p-6">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.jpg" alt="TratraEdu Logo" class="h-10 w-auto object-contain">
                <span class="text-2xl font-bold text-white hidden sm:block">TratraEdu</span>
            </a>
        </div>
        <nav class="flex-grow px-4 space-y-2 mt-4">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-indigo-800 rounded-lg text-white font-medium">
                <span>🏠</span> Dashboard
            </a>
            <a href="courses.html" class="flex items-center gap-3 px-4 py-3 text-indigo-200 hover:bg-indigo-800 hover:text-white rounded-lg transition">
                <span>📚</span> Browse Courses
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-indigo-200 hover:bg-indigo-800 hover:text-white rounded-lg transition">
                <span>🏆</span> Certifications
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-indigo-200 hover:bg-indigo-800 hover:text-white rounded-lg transition">
                <span>💬</span> Community
            </a>
        </nav>
        <div class="p-6 border-t border-indigo-800">
            <div class="flex items-center gap-3">
                <div id="user-avatar" class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center font-bold">--</div>
                <div>
                    <p id="user-name" class="text-sm font-medium">Loading...</p>
                    <p id="user-role" class="text-xs text-indigo-300">Teacher</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="mt-4 w-full text-center text-sm text-indigo-300 hover:text-white transition">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow overflow-y-auto">
        <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
            <h2 id="welcome-msg" class="text-xl font-bold text-slate-800">Welcome back! 👋</h2>
            <div class="flex items-center gap-4">
                <button class="p-2 text-slate-400 hover:text-indigo-600 transition relative">
                    <span>🔔</span>
                </button>
                <img id="nav-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="w-8 h-8 rounded-full border">
            </div>
        </header>

        <div class="p-8">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm mb-1">Courses Enrolled</p>
                    <h3 id="stat-enrolled" class="text-3xl font-bold">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm mb-1">Courses Completed</p>
                    <h3 id="stat-completed" class="text-3xl font-bold">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm mb-1">Current Level</p>
                    <h3 id="stat-level" class="text-3xl font-bold">Novice</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column: Learning Progress -->
                <div class="lg:col-span-2">
                    <h3 class="text-2xl font-bold text-slate-800 mb-6">Your Training Progress</h3>
                    <div id="courses-grid" class="grid grid-cols-1 gap-6">
                        <!-- Dynamic Content -->
                    </div>
                </div>

                <!-- Right Column: My Scores -->
                <div class="lg:col-span-1">
                    <h3 class="text-2xl font-bold text-slate-800 mb-6">My Test Scores</h3>
                    <div id="scores-list" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
      function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c])); }
      async function initDashboard() {
        try {
          const state = await Tratra.auth.ready;
          const user = Tratra.auth.getCurrentUser();
          if (!state.user || !user) { window.location.href = 'login.html'; return; }
          document.getElementById('user-name').innerText = user.name;
          document.getElementById('welcome-msg').innerText = `Welcome back, ${user.name.split(' ')[0]}!`;
          document.getElementById('user-avatar').innerText = user.name.charAt(0).toUpperCase();
          document.getElementById('nav-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=6366f1&color=fff`;
          const access = await Tratra.lms.getAccess(user.uid);
          const ids = access.bundleAccess ? Object.keys(Tratra.courses) : (access.courses || []).filter((id) => Tratra.courses[id]);
          const progress = await Promise.all(ids.map((id) => Tratra.lms.getProgress(user.uid, id)));
          const scores = await Tratra.lms.getScores(user.uid);
          document.getElementById('stat-enrolled').innerText = ids.length;
          document.getElementById('stat-completed').innerText = progress.filter((item) => item.completed || Number(item.progress) >= 100).length;
          document.getElementById('stat-level').innerText = ids.length >= 8 ? 'Advanced' : ids.length ? 'Developing' : 'New learner';
          const grid = document.getElementById('courses-grid'); grid.innerHTML = '';
          if (!ids.length) { grid.innerHTML = '<div class="col-span-full text-center py-12 bg-white rounded-2xl border-2 border-dashed border-slate-200"><p class="text-slate-500 mb-4">You have not enrolled in any courses yet.</p><a href="courses.html" class="text-indigo-600 font-bold hover:underline">Explore the Catalog →</a></div>'; }
          else ids.forEach((id, index) => { const course = Tratra.courses[id]; const item = progress[index] || { progress: 0 }; const score = scores[id]; const card = document.createElement('div'); card.className = 'bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition group flex justify-between items-center'; card.innerHTML = `<div class="flex-grow"><div class="flex items-center gap-3 mb-2"><h3 class="text-lg font-bold text-slate-800">${escapeHtml(course.title)}</h3>${score ? `<span class="text-sm font-bold text-green-600">Score: ${escapeHtml(score.score)}/100</span>` : '<span class="text-sm text-slate-400 italic">No quiz taken</span>'}</div><div class="flex items-center gap-4"><div class="flex-grow bg-slate-100 rounded-full h-2 max-w-xs"><div class="bg-indigo-600 h-2 rounded-full" style="width:${Math.max(0, Math.min(100, Number(item.progress) || 0))}%"></div></div><span class="text-xs font-bold text-slate-500">${Number(item.progress) || 0}%</span></div></div><div class="ml-6"><a href="course.html?id=${encodeURIComponent(id)}" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition">Continue</a></div>`; grid.appendChild(card); });
          const scoresList = document.getElementById('scores-list'); scoresList.innerHTML = ''; const scoreEntries = Object.entries(scores); if (!scoreEntries.length) scoresList.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">No scores recorded yet.</p>'; else scoreEntries.forEach(([id, data]) => { const item = document.createElement('div'); item.className = 'flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100'; item.innerHTML = `<span class="text-sm font-medium text-slate-700">${escapeHtml(Tratra.courses[id]?.title || id)}</span><span class="text-sm font-bold ${Number(data.score) >= 60 ? 'text-green-600' : 'text-red-600'}">${escapeHtml(data.score)}/100</span>`; scoresList.appendChild(item); });
        } catch (error) { console.error(error); alert(error.message || 'Could not load your dashboard.'); window.location.href = 'login.html'; }
      }
      async function handleLogout() { await Tratra.auth.logout(); window.location.href = 'login.html'; }
      window.addEventListener('load', initDashboard);
    </script></body>
</html>
