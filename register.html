<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account | Tratra</title>
    <meta name="description" content="Create a Tratra educator account and begin professional development training.">
    <link rel="canonical" href="https://tratraedu.com/register.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="system.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center gap-3"><img src="logo.jpg" alt="TratraEdu logo" class="h-12 w-auto object-contain"><span class="text-2xl font-bold text-slate-800 hidden sm:block">TratraEdu</span></a>
                <a href="index.html" class="text-slate-600 hover:text-indigo-600 transition">Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8"><h1 class="text-3xl font-bold text-slate-900 mb-2">Create Your Account</h1><p class="text-slate-500">Start your professional journey today.</p></div>
            <form id="registrationForm" class="space-y-5">
                <div><label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label><input id="name" type="text" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="John Doe"></div>
                <div><label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label><input id="email" type="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="john@school.edu"></div>
                <div><label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone / WhatsApp Number</label><input id="phone" type="tel" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="+968 77598158"></div>
                <div><label for="subject" class="block text-sm font-medium text-slate-700 mb-1">Teaching Subject</label><select id="subject" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition"><option>Mathematics</option><option>Science</option><option>English/Literature</option><option>History/Social Studies</option><option>Arts</option><option>Other</option></select></div>
                <div><label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label><input id="password" type="password" required minlength="6" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="At least 6 characters"></div>
                <div class="flex items-start"><input id="terms" type="checkbox" required class="w-4 h-4 mt-1 border border-slate-300 rounded"><label for="terms" class="ml-3 text-sm text-slate-500">I agree to the <a href="terms.html" class="text-indigo-600 hover:underline">Terms and Conditions</a> and <a href="privacy.html" class="text-indigo-600 hover:underline">Privacy Policy</a>.</label></div>
                <p id="registrationStatus" class="hidden text-sm rounded-lg p-3"></p>
                <button id="registerButton" type="submit" class="w-full py-3 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg">Create Account</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-500">Already have an account? <a href="login.html" class="text-indigo-600 font-semibold hover:underline">Sign in</a></p>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 mt-auto"><div class="max-w-7xl mx-auto px-4 text-center text-sm"><a href="privacy.html" class="mx-3 hover:text-white">Privacy Policy</a><a href="terms.html" class="mx-3 hover:text-white">Terms</a><a href="contact.html" class="mx-3 hover:text-white">Contact</a><p class="mt-5">&copy; 2026 Tratra - Training trainers. All rights reserved.</p></div></footer>

    <script>
      document.getElementById("registrationForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("registerButton");
        const status = document.getElementById("registrationStatus");
        button.disabled = true;
        button.textContent = "Creating account...";
        status.className = "hidden";
        try {
          await Tratra.auth.signup({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            subject: document.getElementById("subject").value,
            password: document.getElementById("password").value
          });
          const requestedCourse = new URLSearchParams(window.location.search).get("course");
          window.location.href = requestedCourse ? `payment.html?course=${encodeURIComponent(requestedCourse)}` : "payment.html";
        } catch (error) {
          status.textContent = error.message || "Could not create the account.";
          status.className = "text-sm rounded-lg p-3 bg-red-50 text-red-700";
          button.disabled = false;
          button.textContent = "Create Account";
        }
      });
    </script>
</body>
</html>
