<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - Tratra</title>
    <meta name="description" content="Work through your Tratra professional-development course lessons and resources.">
    <link rel="canonical" href="https://tratraedu.com/course.html">
    <meta property="og:title" content="Course Player | Tratra">
    <meta property="og:description" content="Work through your Tratra professional-development course lessons and resources.">
    <meta property="og:url" content="https://tratraedu.com/course.html">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="system.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex">

    <!-- Course Navigation -->
    <aside class="w-80 bg-white border-r border-slate-200 hidden lg:flex flex-col">
        <div class="p-6 border-b border-slate-100">
            <a href="dashboard.html" class="text-indigo-600 font-medium flex items-center gap-2 hover:underline">
                ← Back to Dashboard
            </a>
            <h3 id="course-title" class="text-xl font-bold mt-6">Course Loading...</h3>
            <div class="mt-2 w-full bg-slate-100 rounded-full h-2">
                <div id="course-progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="course-progress-text" class="text-xs text-slate-500 mt-2">0% Completed</p>
        </div>
        
        <!-- Resources Section -->
        <div class="p-6 bg-indigo-50 border-b border-indigo-100">
            <h4 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-4">Course Resources</h4>
            <div class="space-y-3">
                <a id="res-ppt" href="#" class="flex items-center gap-3 text-sm font-medium text-indigo-700 hover:text-indigo-900 transition">
                    <span>📊</span> Presentation (PPT)
                </a>
                <a id="res-pdf" href="#" class="flex items-center gap-3 text-sm font-medium text-indigo-700 hover:text-indigo-900 transition">
                    <span>📄</span> Course Handbook (PDF)
                </a>
                <a id="res-video" href="#" class="flex items-center gap-3 text-sm font-medium text-indigo-700 hover:text-indigo-900 transition">
                    <span>🎥</span> Full Lecture Video
                </a>
            </div>
        </div>

        <nav class="flex-grow overflow-y-auto p-6 space-y-6" id="course-syllabus">
            <!-- Syllabus injected by JS -->
        </nav>
    </aside>

    <!-- Lesson Content -->
    <main class="flex-grow overflow-y-auto">
        <div class="max-w-4xl mx-auto px-8 py-12">
            <div class="mb-8">
                <span id="lesson-module" class="text-indigo-600 font-bold text-sm uppercase tracking-wide">Module 1 • Lesson 1</span>
                <h1 id="lesson-title" class="text-4xl font-extrabold text-slate-900 mt-2">Loading Lesson...</h1>
            </div>

            <!-- Video Player Mockup -->
            <div class="aspect-video bg-slate-900 rounded-3xl shadow-2xl mb-10 flex items-center justify-center relative overflow-hidden group cursor-pointer" onclick="completeLesson()">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white text-3xl group-hover:scale-110 transition duration-300 shadow-xl border border-white/30">
                    ▶
                </div>
                <div class="absolute bottom-6 left-6 text-white">
                    <p class="font-medium">Click to simulate watching the lesson</p>
                    <p class="text-sm text-slate-300">Completion unlocks the next lesson</p>
                </div>
            </div>

            <div id="lesson-body" class="prose prose-slate max-w-none">
                <!-- Content injected by JS -->
            </div>

            <div class="flex justify-between items-center mt-16 pt-8 border-t border-slate-200">
                <button onclick="prevLesson()" class="px-6 py-3 text-slate-600 font-medium hover:text-indigo-600 transition">← Previous Lesson</button>
                <button id="next-btn" onclick="completeLesson()" class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">Complete and Continue →</button>
            </div>
        </div>
    </main>

    <script>
      let currentCourseId = '';
      let currentModuleIdx = 0;
      let currentLessonIdx = 0;
      let currentCourse;

      function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c])); }
      async function initCourse() {
        currentCourseId = new URLSearchParams(window.location.search).get('id') || 'c1';
        const state = await Tratra.auth.ready;
        const user = Tratra.auth.getCurrentUser();
        if (!state.user || !user) { window.location.href = 'login.html'; return; }
        if (!(await Tratra.lms.checkAccess(user.uid, currentCourseId))) { alert('You are not enrolled in this course. Please complete manual payment verification first.'); window.location.href = 'courses.html'; return; }
        currentCourse = Tratra.courses[currentCourseId] || Tratra.courses.c1;
        document.getElementById('course-title').innerText = currentCourse.title;
        document.getElementById('res-ppt').href = currentCourse.resources?.ppt || '#';
        document.getElementById('res-pdf').href = currentCourse.resources?.pdf || '#';
        const video = document.getElementById('res-video');
        if (currentCourse.resources?.video) video.href = currentCourse.resources.video; else { video.classList.add('hidden'); }
        renderSyllabus();
        loadLesson();
        await updateProgressBar();
      }
      function courseModules() { return Tratra.courseContent[currentCourseId] || Tratra.courseContent.c1; }
      function renderSyllabus() {
        const nav = document.getElementById('course-syllabus'); nav.innerHTML = '';
        courseModules().forEach((module, mIdx) => { const wrap = document.createElement('div'); wrap.innerHTML = `<h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">${escapeHtml(module.title)}</h2>`; const list = document.createElement('div'); list.className = 'space-y-3 mb-6'; module.lessons.forEach((lesson, lIdx) => { const link = document.createElement('a'); link.href = '#'; link.className = `flex items-center gap-3 text-sm font-medium transition ${mIdx === currentModuleIdx && lIdx === currentLessonIdx ? 'text-indigo-600 font-bold' : 'text-slate-700 hover:text-indigo-600'}`; link.innerHTML = `<span class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-xs">${lIdx + 1}</span>${escapeHtml(lesson.title)}`; link.onclick = (event) => { event.preventDefault(); currentModuleIdx = mIdx; currentLessonIdx = lIdx; loadLesson(); renderSyllabus(); }; list.appendChild(link); }); wrap.appendChild(list); nav.appendChild(wrap); });
      }
      function loadLesson() { const module = courseModules()[currentModuleIdx]; const lesson = module.lessons[currentLessonIdx]; document.getElementById('lesson-module').innerText = `Module ${currentModuleIdx + 1} • Lesson ${currentLessonIdx + 1}`; document.getElementById('lesson-title').innerText = lesson.title; document.getElementById('lesson-body').innerHTML = `<p class="text-slate-600 text-lg leading-relaxed">${escapeHtml(lesson.body)}</p>`; }
      async function completeLesson() {
        const user = Tratra.auth.getCurrentUser(); const modules = courseModules(); const totalLessons = modules.reduce((total, module) => total + module.lessons.length, 0); const completedNumber = modules.slice(0, currentModuleIdx).reduce((total, module) => total + module.lessons.length, 0) + currentLessonIdx + 1; await Tratra.lms.updateProgress(user.uid, currentCourseId, Math.round((completedNumber / totalLessons) * 100)); await updateProgressBar(); currentLessonIdx++; if (currentLessonIdx >= modules[currentModuleIdx].lessons.length) { currentLessonIdx = 0; currentModuleIdx++; } if (currentModuleIdx >= modules.length) { alert('Congratulations! You completed this course section. You can now take the final quiz.'); window.location.href = `quiz.html?id=${encodeURIComponent(currentCourseId)}`; } else { loadLesson(); renderSyllabus(); } }
      async function updateProgressBar() { const user = Tratra.auth.getCurrentUser(); const item = await Tratra.lms.getProgress(user.uid, currentCourseId); const progress = Number(item.progress) || 0; document.getElementById('course-progress-bar').style.width = `${progress}%`; document.getElementById('course-progress-text').innerText = `${progress}% Completed`; }
      function prevLesson() { if (currentLessonIdx > 0) currentLessonIdx--; else if (currentModuleIdx > 0) { currentModuleIdx--; currentLessonIdx = Math.max(0, courseModules()[currentModuleIdx].lessons.length - 1); } loadLesson(); renderSyllabus(); }
      window.addEventListener('load', initCourse);
    </script></body>
</html>
